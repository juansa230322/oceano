    const { useState, useEffect, useMemo, useRef } = React;

    const INTERESTS_CATALOG = [
      'Limpieza de playas y fondos marinos',
      'Restauración y siembra de corales',

    // Helper para renderizar Avatar (Emoji Marino o Imagen)
    function UserAvatar({ avatar, size = "w-10 h-10", textSize = "text-xl", className = "" }) {
      const isEmoji = !avatar || (!avatar.startsWith('http') && !avatar.startsWith('data:'));
      if (isEmoji) {
        return (
          <div className={`${size} rounded-2xl bg-gradient-to-tr from-cyan-400 via-teal-400 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20 ring-2 ring-cyan-400/40 select-none flex-shrink-0 ${className}`}>
            <span className={textSize}>{avatar || '🐢'}</span>
          </div>
        );
      }
      return (
        <img
          src={avatar}
          alt="Avatar"
          className={`${size} rounded-2xl object-cover ring-2 ring-cyan-400/40 flex-shrink-0 ${className}`}
        />
      );
    }

    // ================================================================
    // ARQUITECTURA POO: CLASES DE DOMINIO (SPRINT 1 + SPRINT 2)
    // ================================================================

    class User {
      constructor(data = {}) {
        this.id = data.id || ('u-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5));
        this.name = data.name || 'Usuario';
        this.email = data.email || '';
        this.password = data.password || 'Password123!';
        this.role = data.role || 'ciudadano'; // 'administrador' | 'experto' | 'voluntario' | 'ciudadano'
        this.status = data.status || 'activo'; // 'activo' | 'suspendido'
        this.location = data.location || 'Santa Marta, Colombia';
        this.avatar = data.avatar || '🐢'; // Por defecto emoji marino
        this.xp = Number(data.xp || 50);
        this.level = Number(data.level || Math.floor(this.xp / 100) + 1);
        this.earnedBadgeIds = Array.isArray(data.earnedBadgeIds) ? [...data.earnedBadgeIds] : [];
        this.enrolledActivityIds = Array.isArray(data.enrolledActivityIds) ? [...data.enrolledActivityIds] : [];
        this.createdAt = data.createdAt || new Date().toISOString();
      }

      canModerate() {
        return this.role === 'administrador';
      }

      canCreateActivity() {
        return this.role === 'administrador';
      }

      canEditAnyActivity() {
        return this.role === 'administrador';
      }

      canDeleteAnyActivity() {
        return this.role === 'administrador';
      }

      canEditPost(post) {
        return this.role === 'administrador' || this.name === post.author;
      }

      canDeletePost(post) {
        return this.role === 'administrador' || this.name === post.author;
      }

      canPublishScience() {
        return this.role === 'experto' || this.role === 'administrador';
      }

      getRoleBadgeColor() {
        switch (this.role) {
          case 'administrador': return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
          case 'experto': return 'bg-purple-500/20 text-purple-300 border-purple-500/40';
          case 'voluntario': return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
          case 'ciudadano': return 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40';
          default: return 'bg-slate-700 text-slate-300 border-slate-600';
        }
      }

      getRoleTitle() {
        switch (this.role) {
          case 'administrador': return 'Admin General';
          case 'experto': return 'Investigador Marino';
          case 'voluntario': return 'Voluntario Oceánico';
          case 'ciudadano': return 'Ciudadano Colaborador';
          default: return this.role;
        }
      }

      addXP(pts) {
        this.xp += pts;
        this.level = Math.floor(this.xp / 100) + 1;
      }

      awardBadge(badgeId) {
        if (!this.earnedBadgeIds.includes(badgeId)) {
          this.earnedBadgeIds.push(badgeId);
          this.addXP(100);
          return true;
        }
        return false;
      }

      hasBadge(badgeId) {
        return this.earnedBadgeIds.includes(badgeId);
      }

      enrollInActivity(actId) {
        if (!this.enrolledActivityIds.includes(actId)) {
          this.enrolledActivityIds.push(actId);
          this.addXP(30);
          return true;
        }
        return false;
      }

      cancelActivityEnrollment(actId) {
        const idx = this.enrolledActivityIds.indexOf(actId);
        if (idx > -1) {
          this.enrolledActivityIds.splice(idx, 1);
          return true;
        }
        return false;
      }

      isEnrolledIn(actId) {
        return this.enrolledActivityIds.includes(actId);
      }
    }

    class Volunteer extends User {
      constructor(data = {}) {
        super(data);
        this.role = 'voluntario';
        this.interests = Array.isArray(data.interests) ? [...data.interests] : ['Limpieza de playas y fondos marinos'];
        this.participations = Array.isArray(data.participations) ? [...data.participations] : [];
      }

      calculateTotalHours() {
        return this.participations.reduce((acc, p) => acc + (Number(p.hours) || 0), 0);
      }

      addParticipation(actName, hours = 2) {
        const p = {
          id: 'part-' + Date.now(),
          activityName: actName || 'Jornada Comunitaria de Conservación',
          hours: Number(hours),
          registeredAt: new Date().toISOString(),
          status: 'completada'
        };
        this.participations.unshift(p);
        this.addXP(hours * 15);
        return p;
      }
    }

    class Expert extends User {
      constructor(data = {}) {
        super(data);
        this.role = 'experto';
        this.institution = data.institution || 'Instituto de Investigaciones Marinas y Costeras (INVEMAR)';
        this.biologicalSpecialty = data.biologicalSpecialty || data.specialty || 'Biología Marina y Arrecifes de Coral';
        this.professionalCredentials = data.professionalCredentials || data.credentials || 'PhD en Ciencias del Mar, Reg. INVEMAR #4821';
        this.scientificBio = data.scientificBio || data.bio || 'Investigador(a) marino con amplia experiencia liderando programas de reproducción asistida de corales y áreas marinas protegidas en el Caribe.';
        this.researchAreas = Array.isArray(data.researchAreas) ? [...data.researchAreas] : (data.researchAreas ? JSON.parse(data.researchAreas) : ['Restauración de corales', 'Acidificación oceánica', 'Áreas marinas protegidas']);
        this.publications = Array.isArray(data.publications) ? [...data.publications] : [
          {
            id: 'pub-1',
            title: 'Impacto del blanqueamiento térmico en comunidades coralinas someras',
            year: 2024,
            journal: 'Revista de Biología Tropical',
            url: 'https://doi.org/10.15517/rbt.v72i1.55432'
          }
        ];
      }

      updateBio(newBio) {
        this.scientificBio = String(newBio || '').trim();
      }

      addPublication(pub) {
        const item = {
          id: 'pub-' + Date.now(),
          title: pub.title.trim(),
          year: Number(pub.year || new Date().getFullYear()),
          journal: (pub.journal || 'Revista de Investigación Marina').trim(),
          url: (pub.url || '').trim()
        };
        this.publications.unshift(item);
        this.addXP(50);
        return item;
      }

      removePublication(pubId) {
        this.publications = this.publications.filter(p => String(p.id) !== String(pubId));
      }

      updateResearchAreas(areas) {
        this.researchAreas = Array.isArray(areas) ? areas : [];
      }
    }

    class Citizen extends User {
      constructor(data = {}) {
        super(data);
        this.role = 'ciudadano';
        this.reports = Array.isArray(data.reports) ? [...data.reports] : [];
        this.donations = Array.isArray(data.donations) ? [...data.donations] : [];
      }
    }

    class AdminCoordinator extends User {
      constructor(data = {}) {
        super(data);
        this.role = 'administrador';
      }

      canModerate() { return true; }
      canCreateActivity() { return true; }
      canEditAnyActivity() { return true; }
      canDeleteAnyActivity() { return true; }
      canEditPost() { return true; }
      canDeletePost() { return true; }
    }

    class Activity {
      constructor(data = {}) {
        this.id = data.id || ('act-' + Date.now());
        this.name = data.name || data.title || 'Actividad de Conservación';
        this.title = this.name;
        this.date = data.date || '2026-11-15';
        this.time = data.time || '08:00 - 12:00';
        this.location = data.location || 'Parque Nacional Natural Corales del Rosario';
        this.responsible = data.responsible || 'Coordinación ODS 14';
        this.type = data.type || data.activity_type || 'Conservación';
        this.totalSpots = Number(data.totalSpots || data.volunteer_spots || 30);
        this.volunteer_spots = this.totalSpots;
        this.enrolledCount = Number(data.enrolledCount || (data.enrolledUserIds ? data.enrolledUserIds.length : 0));
        this.enrolledUserIds = Array.isArray(data.enrolledUserIds) ? [...data.enrolledUserIds] : [];
        this.description = data.description || '';
        this.requirements = data.requirements || data.requisitos || 'Protector solar biodegradable, agua, calzado cerrado acuático.';
        this.hours = Number(data.hours || data.volunteer_hours || 4);
        this.xp = Number(data.xp || data.xp_reward || 100);
        this.image = data.image || null;
        this.isBacklog = Boolean(data.isBacklog);
      }

      getAvailableSpots() {
        return Math.max(0, this.totalSpots - this.enrolledUserIds.length);
      }

      isFull() {
        return this.getAvailableSpots() <= 0;
      }

      enrollUser(userId) {
        if (this.isFull() || this.enrolledUserIds.includes(userId)) return false;
        this.enrolledUserIds.push(userId);
        this.enrolledCount = this.enrolledUserIds.length;
        return true;
      }

      cancelUserEnrollment(userId) {
        const idx = this.enrolledUserIds.indexOf(userId);
        if (idx > -1) {
          this.enrolledUserIds.splice(idx, 1);
          this.enrolledCount = this.enrolledUserIds.length;
          return true;
        }
        return false;
      }
    }

    class Badge {
      constructor(data = {}) {
        this.id = data.id || ('badge-' + Date.now());
        this.code = data.code || 'B00';
        this.name = data.name || 'Insignia';
        this.description = data.description || '';
        this.icon = data.icon || '🏅';
        this.requiredHours = Number(data.requiredHours || data.required_hours || 0);
        this.requiredActivities = Number(data.requiredActivities || data.required_activities || 0);
        this.requirement = data.requirement || `${this.requiredHours} horas de voluntariado`;
      }

      isEarnedBy(user) {
        if (!user) return false;
        if (user.earnedBadgeIds.includes(this.id) || user.earnedBadgeIds.includes(this.code)) {
          return true;
        }
        if (this.requiredHours > 0 || this.requiredActivities > 0) {
          const hours = (typeof user.calculateTotalHours === 'function') ? user.calculateTotalHours() : 0;
          const acts = user.participations ? user.participations.length : user.enrolledActivityIds.length;
          if (hours >= this.requiredHours && acts >= this.requiredActivities) {
            return true;
          }
        }
        return false;
      }

      awardTo(user) {
        if (!user) return false;
        return user.awardBadge(this.id);
      }
    }

    class ForumComment {
      constructor(data = {}) {
        this.id = data.id || ('c-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4));
        this.author = data.author || 'Usuario Anónimo';
        this.avatar = data.avatar || '🐟';
        this.role = data.role || 'voluntario';
        this.content = data.content || '';
        this.createdAt = data.createdAt || 'Hace un momento';
      }
    }

    class ForumPost {
      constructor(data = {}) {
        this.id = data.id || ('post-' + Date.now());
        this.author = data.author || 'Usuario';
        this.avatar = data.avatar || '🐢';
        this.role = data.role || 'voluntario';
        this.category = data.category || 'Conservación';
        this.title = data.title || 'Publicación en el Foro';
        this.content = data.content || '';
        this.likes = Number(data.likes || 0);
        this.likedBy = Array.isArray(data.likedBy) ? [...data.likedBy] : [];
        this.comments = Array.isArray(data.comments)
          ? data.comments.map(c => c instanceof ForumComment ? c : new ForumComment(c))
          : [];
        this.createdAt = data.createdAt || new Date().toISOString();
      }

      toggleLike(userId = 'anon') {
        const idx = this.likedBy.indexOf(userId);
        if (idx > -1) {
          this.likedBy.splice(idx, 1);
          this.likes = Math.max(0, this.likes - 1);
          return false;
        } else {
          this.likedBy.push(userId);
          this.likes += 1;
          return true;
        }
      }

      addComment(commentData) {
        const comment = commentData instanceof ForumComment ? commentData : new ForumComment(commentData);
        this.comments.push(comment);
        return comment;
      }
    }

    // ================================================================
    // SERVICIO DE BASE DE DATOS Y CONEXIÓN CON SUPABASE CLOUD
    // ================================================================

    const SUPABASE_URL = window.VM_SUPABASE_URL || 'https://cwloplscncnokpxbnalo.supabase.co';
    const SUPABASE_ANON_KEY = window.VM_SUPABASE_ANON_KEY || 'sb_publishable_595MB3MoZ2HK4I_4QWcE2Q_8AGQ0JHd';

    const supabase = (typeof window.supabase !== 'undefined' && window.supabase.createClient)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    class DatabaseService {
      static instance = null;
      static getInstance() {
        if (!DatabaseService.instance) {
          DatabaseService.instance = new DatabaseService();
        }
        return DatabaseService.instance;
      }

      constructor() {
        this.dbKey = 'vida_marina_ods14';
      }

      hydrateUser(raw) {
        if (!raw) return null;
        switch (raw.role) {
          case 'administrador': return new AdminCoordinator(raw);
          case 'experto': return new Expert(raw);
          case 'voluntario': return new Volunteer(raw);
          case 'ciudadano': return new Citizen(raw);
          default: return new User(raw);
        }
      }

      hydrateActivity(raw) {
        return new Activity(raw);
      }

      hydrateBadge(raw) {
        return new Badge(raw);
      }

      hydratePost(raw) {
        return new ForumPost(raw);
      }

      loadUsers(seed) {
        const raw = localStorage.getItem(this.dbKey + '_users');
        if (raw) {
          try {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) {
              return arr.map(u => this.hydrateUser(u));
            }
          } catch (e) {}
        }
        return seed.map(u => this.hydrateUser(u));
      }

      saveUsers(users) {
        localStorage.setItem(this.dbKey + '_users', JSON.stringify(users));
      }

      loadCurrentUserId(defaultValue = null) {
        return localStorage.getItem(this.dbKey + '_current_uid') || defaultValue;
      }

      saveCurrentUserId(uid) {
        if (uid) localStorage.setItem(this.dbKey + '_current_uid', uid);
        else localStorage.removeItem(this.dbKey + '_current_uid');
      }

      loadActivities(seed) {
        const raw = localStorage.getItem(this.dbKey + '_activities');
        if (raw) {
          try {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) {
              return arr.map(a => this.hydrateActivity(a));
            }
          } catch (e) {}
        }
        return seed.map(a => this.hydrateActivity(a));
      }

      saveActivities(acts) {
        localStorage.setItem(this.dbKey + '_activities', JSON.stringify(acts));
      }

      loadBadges(seed) {
        const raw = localStorage.getItem(this.dbKey + '_badges');
        if (raw) {
          try {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) {
              return arr.map(b => this.hydrateBadge(b));
            }
          } catch (e) {}
        }
        return seed.map(b => this.hydrateBadge(b));
      }

      saveBadges(badges) {
        localStorage.setItem(this.dbKey + '_badges', JSON.stringify(badges));
      }

      loadForum(seed) {
        const raw = localStorage.getItem(this.dbKey + '_forum');
        if (raw) {
          try {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) {
              return arr.map(p => this.hydratePost(p));
            }
          } catch (e) {}
        }
        return seed.map(p => this.hydratePost(p));
      }

      saveForum(posts) {
        localStorage.setItem(this.dbKey + '_forum', JSON.stringify(posts));
      }
    }

    // Sincronización en la nube con Supabase
    const VidaMarinaCloud = {
      isConfigured: Boolean(supabase),

      async loadForum() {
        if (!this.isConfigured) return null;
        try {
          const { data, error } = await supabase
            .from('vida_marina_forum')
            .select('posts')
            .eq('id', 1)
            .maybeSingle();
          if (error) return null;
          return data && Array.isArray(data.posts) ? data.posts : null;
        } catch (e) {
          return null;
        }
      },

      async saveForum(posts) {
        if (!this.isConfigured) return;
        try {
          await supabase
            .from('vida_marina_forum')
            .upsert({ id: 1, posts, updated_at: new Date().toISOString() }, { onConflict: 'id' });
        } catch (e) {}
      },

      async loadUsers() {
        if (!this.isConfigured) return null;
        try {
          const { data, error } = await supabase
            .from('vida_marina_users')
            .select('users')
            .eq('id', 1)
            .maybeSingle();
          if (error) return null;
          return data && Array.isArray(data.users) ? data.users : null;
        } catch (e) {
          return null;
        }
      },

      async saveUsers(users) {
        if (!this.isConfigured) return;
        try {
          await supabase
            .from('vida_marina_users')
            .upsert({ id: 1, users, updated_at: new Date().toISOString() }, { onConflict: 'id' });
        } catch (e) {}
      },

      subscribe(onForumChange, onUsersChange) {
        if (!this.isConfigured) return null;
        try {
          const channel = supabase
            .channel('public:vida_marina_realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vida_marina_forum' }, payload => {
              if (payload.new && Array.isArray(payload.new.posts) && onForumChange) {
                onForumChange(payload.new.posts);
              }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vida_marina_users' }, payload => {
              if (payload.new && Array.isArray(payload.new.users) && onUsersChange) {
                onUsersChange(payload.new.users);
              }
            })
            .subscribe();
          return channel;
        } catch (e) {
          return null;
        }
      },

      unsubscribe(channel) {
        if (!this.isConfigured || !channel) return;
        try {
          supabase.removeChannel(channel);
        } catch (e) {}
      }
    };

      // Notificaciones Toast
      const [toasts, setToasts] = useState([]);
      const showToast = (message, type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4500);
      };

      // Sincronización en tiempo real con Supabase
      const cloudSyncRef = useRef({ ready: false, applying: false });

      useEffect(() => {
        let isCancelled = false;
        let channel = null;

        const initCloudSync = async () => {
          if (!VidaMarinaCloud.isConfigured) {
            cloudSyncRef.current.ready = true;
            return;
          }

          // Foro
          const remotePosts = await VidaMarinaCloud.loadForum();
          if (!isCancelled && Array.isArray(remotePosts) && remotePosts.length > 0) {
            cloudSyncRef.current.applying = true;
            setForumPosts(remotePosts.map(p => db.hydratePost(p)));
            setTimeout(() => { cloudSyncRef.current.applying = false; }, 50);
          } else if (!isCancelled) {
            await VidaMarinaCloud.saveForum(forumPosts);
          }

          // Usuarios
          const remoteUsers = await VidaMarinaCloud.loadUsers();
          if (!isCancelled && Array.isArray(remoteUsers) && remoteUsers.length > 0) {
            cloudSyncRef.current.applying = true;
            setUsers(remoteUsers.map(u => db.hydrateUser(u)));
            setTimeout(() => { cloudSyncRef.current.applying = false; }, 50);
          } else if (!isCancelled) {
            await VidaMarinaCloud.saveUsers(users);
          }

          cloudSyncRef.current.ready = true;

          // Suscribirse a cambios en tiempo real
          channel = VidaMarinaCloud.subscribe(
            (updatedPosts) => {
              if (isCancelled) return;
              cloudSyncRef.current.applying = true;
              setForumPosts(updatedPosts.map(p => db.hydratePost(p)));
              setTimeout(() => { cloudSyncRef.current.applying = false; }, 50);

            (updatedUsers) => {
              if (isCancelled) return;
              cloudSyncRef.current.applying = true;
              setUsers(updatedUsers.map(u => db.hydrateUser(u)));
              setTimeout(() => { cloudSyncRef.current.applying = false; }, 50);
            }
          );
        };

        initCloudSync();

        return () => {
          isCancelled = true;
          VidaMarinaCloud.unsubscribe(channel);
        };

                </button>
                <h3 className="text-xl font-black text-white">Editar Biografía Científica</h3>
                <form onSubmit={handleSaveBio} className="space-y-3">
                  <textarea
                    rows="5"
                    required
                    value={bioInput}
                    onChange={e => setBioInput(e.target.value)}
                    className="w-full bg-[#0b2545] border border-cyan-500/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400"
                  ></textarea>
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs uppercase hover:bg-cyan-400"
                  >
                    Guardar Biografía
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 10. MODAL AGREGAR PUBLICACIÓN (EXPERTO) */}
          {addPubModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
              <div className="relative w-full max-w-lg bg-[#07192f] border border-purple-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4">
                <button
                  onClick={() => setAddPubModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg p-1"
                >
                  ✕
                </button>
                <h3 className="text-xl font-black text-white">Agregar Publicación Científica</h3>
                <form onSubmit={handleAddPublication} className="space-y-3">
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-300">Título del Artículo</label>
                    <input
                      type="text"
                      required
                      placeholder="Genómica y adaptación de corales en aguas someras"
                      value={pubTitle}
                      onChange={e => setPubTitle(e.target.value)}
                      className="w-full bg-[#0b2545] border border-purple-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-300">Año</label>
                      <input
                        type="number"
                        required
                        value={pubYear}
                        onChange={e => setPubYear(e.target.value)}
                        className="w-full bg-[#0b2545] border border-purple-500/30 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-300">Revista Indexada</label>
                      <input
                        type="text"
                        placeholder="Marine Ecology Progress Series"
                        value={pubJournal}
                        onChange={e => setPubJournal(e.target.value)}
                        className="w-full bg-[#0b2545] border border-purple-500/30 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-300">Enlace / DOI</label>
                    <input
                      type="url"
                      placeholder="https://doi.org/10.3354/meps14920"
                      value={pubUrl}
                      onChange={e => setPubUrl(e.target.value)}
                      className="w-full bg-[#0b2545] border border-purple-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-purple-500 text-slate-950 font-black text-xs uppercase hover:bg-purple-400"
                  >
                    Guardar Publicación
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 11. MODAL EDITAR ÁREAS (EXPERTO) */}
          {editAreasModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
              <div className="relative w-full max-w-md bg-[#07192f] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4">
                <button
                  onClick={() => setEditAreasModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg p-1"
                >
                  ✕
                </button>
                <h3 className="text-xl font-black text-white">Modificar Áreas de Investigación</h3>
                <p className="text-xs text-slate-400">Ingresa las áreas separadas por coma:</p>
                <form onSubmit={handleSaveAreas} className="space-y-3">
                  <textarea
                    rows="3"
                    value={areasInput}
                    onChange={e => setAreasInput(e.target.value)}
                    className="w-full bg-[#0b2545] border border-cyan-500/30 rounded-xl p-3 text-xs text-white"
                  ></textarea>
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs uppercase"
                  >
                    Guardar Áreas
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 12. MODAL REGISTRAR DENUNCIA */}
          {reportModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
              <div className="relative w-full max-w-md bg-[#07192f] border border-red-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4">
                <button
                  onClick={() => setReportModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg p-1"
                >
                  ✕
                </button>
                <h3 className="text-xl font-black text-white">Registrar Denuncia Ambiental</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast('Denuncia ambiental registrada y enviada a revisión por la autoridad marina.');
                  setReportModalOpen(false);
                  setReportTitle('');
                  setReportDesc('');
                  setReportLoc('');
                }} className="space-y-3">
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-300">Título del Reporte</label>
                    <input
                      type="text"
                      required
                      placeholder="ej. Vertimiento de aceite en ensenada"
                      value={reportTitle}
                      onChange={e => setReportTitle(e.target.value)}
                      className="w-full bg-[#0b2545] border border-red-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-300">Descripción</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Detalles de la fauna o costa afectada..."
                      value={reportDesc}
                      onChange={e => setReportDesc(e.target.value)}
                      className="w-full bg-[#0b2545] border border-red-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    ></textarea>
                  </div>
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-300">Ubicación Precisa</label>
                    <input
                      type="text"
                      required
                      placeholder="ej. Playa Rodadero Sur"
                      value={reportLoc}
                      onChange={e => setReportLoc(e.target.value)}
                      className="w-full bg-[#0b2545] border border-red-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-white font-black text-xs uppercase"
                  >
                    Enviar Denuncia Oficial
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 13. MODAL DONAR */}
          {donateModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
              <div className="relative w-full max-w-md bg-[#07192f] border border-emerald-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4">
                <button
                  onClick={() => setDonateModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg p-1"
                >
                  ✕
                </button>
                <div className="text-center space-y-1">
                  <span className="text-3xl">💙</span>
                  <h3 className="text-xl font-black text-white">Donar a Guarderías de Coral</h3>
                  <p className="text-xs text-slate-400">Cada donación ayuda a rescatar y reproducir corales</p>
                </div>
                <div className="flex gap-2 justify-center">
                  {['10', '25', '50', '100'].map(val => (
                    <button
                      key={val}
                      onClick={() => setDonateAmount(val)}
                      className={`px-4 py-2 rounded-xl text-xs font-black border ${
                        donateAmount === val ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-[#0b2545] text-slate-300 border-slate-700'
                      }`}
                    >
                      ${val} USD
                    </button>
                  ))}
                </div>
                <button
                  onClick={() => {
                    showToast(`¡Gracias por tu donación de $${donateAmount} USD para la siembra de corales!`);
                    setDonateModalOpen(false);
                  }}
                  className="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase"
                >
                  Confirmar Aporte
                </button>
              </div>
            </div>
          )}

          {/* 14. CELEBRACIÓN DE DESBLOQUEO DE INSIGNIA */}
          {unlockedBadgeCelebration && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-in zoom-in-95 duration-200">
              <div className="relative w-full max-w-sm bg-gradient-to-b from-[#0b2545] to-[#07192f] border-2 border-amber-400 rounded-3xl p-8 text-center space-y-4 shadow-2xl">
                <span className="text-6xl animate-bounce block">{unlockedBadgeCelebration.icon}</span>
                <span className="text-xs font-black uppercase tracking-widest text-amber-300 bg-amber-500/20 px-3 py-1 rounded-full border border-amber-500/30">
                  ¡Insignia Desbloqueada!
                </span>
                <h3 className="text-2xl font-black text-white">{unlockedBadgeCelebration.name}</h3>
                <p className="text-xs text-slate-300 leading-relaxed">{unlockedBadgeCelebration.description}</p>
                <div className="p-3 rounded-2xl bg-[#051329] border border-cyan-500/20 text-xs text-cyan-300">
                  +100 Puntos de Experiencia (XP) obtenidos
                </div>
                <button
                  onClick={() => setUnlockedBadgeCelebration(null)}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black text-xs uppercase tracking-wider"
                >
                  ¡Genial, Continuar!
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
